[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[project]
name = "scholar-bib-kit"
version = "0.1.0"
description = "Manage, lint, and deduplicate BibTeX databases."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "bibtexparser>=2.0.0b7",
    "pydantic>=2.0.0",
    "scholar-search-kit",
]

[project.scripts]
scholar-bib = "scholar_bib.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/scholar_bib"]

[tool.uv.sources]
scholar-search-kit = { path = "../scholar-search-kit" }
